<!DOCTYPE html>
<html>
<head>
    <title>UsSpace Login 💜</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right,#ff9a9e,#fad0c4);
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            border: none;
            background: #f2f2f2;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #ff4d6d;
            color: white;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<!-- 🚫 Fake Error Screen -->
<div id="fakeError" class="sys-error">
    <div class="dialog">
        <div class="title">App Error</div>

        <div class="message">
            Unfortunately, this application has stopped.
        </div>

        <button id="okBtn">OK</button>
    </div>
</div>

<!-- 🔒 Real App -->
<div id="realApp" style="display:none;">
    <div class="box">
        <h2>🔒 UsSpace 💜</h2>
        <input type="password" id="pin" placeholder="Enter PIN">
        <button onclick="login()">Unlock</button>
    </div>
</div>

<script>

// Fake exit
function exitApp() {
    // Try to close or go back
    window.history.back();
}

// 🔥 SECRET SWIPE
let startY = 0;
let endY = 0;

document.addEventListener("touchstart", e => {
    startY = e.changedTouches[0].screenY;
});

document.addEventListener("touchend", e => {
    endY = e.changedTouches[0].screenY;

    if (startY - endY > 120) {
        unlock();
    }
});

function unlock() {
    document.getElementById("fakeError").style.display = "none";
    document.getElementById("realApp").style.display = "block";
}

// Login
function login(){
    if(document.getElementById("pin").value === "1436"){
        window.location.href="home.html";
    } else alert("Wrong PIN ❌");
}

</script>

</body>
</html>
